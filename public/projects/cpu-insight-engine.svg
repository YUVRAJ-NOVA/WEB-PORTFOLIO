<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="800" height="400" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circuit board pattern -->
  <g opacity="0.1">
    <line x1="100" y1="50" x2="200" y2="50" stroke="#3b82f6" stroke-width="2"/>
    <line x1="200" y1="50" x2="200" y2="100" stroke="#06b6d4" stroke-width="2"/>
    <line x1="300" y1="80" x2="400" y2="80" stroke="#10b981" stroke-width="2"/>
    <line x1="500" y1="60" x2="600" y2="60" stroke="#3b82f6" stroke-width="2"/>
    <line x1="600" y1="60" x2="600" y2="120" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="200" cy="50" r="4" fill="#3b82f6"/>
    <circle cx="200" cy="100" r="4" fill="#06b6d4"/>
    <circle cx="400" cy="80" r="4" fill="#10b981"/>
    <circle cx="600" cy="60" r="4" fill="#3b82f6"/>
  </g>
  
  <!-- Main CPU chip visualization -->
  <g transform="translate(400, 200)">
    <!-- CPU chip body -->
    <rect x="-80" y="-80" width="160" height="160" rx="10" fill="#1a1f35" stroke="url(#accent)" stroke-width="3"/>
    
    <!-- CPU pins (left and right) -->
    <g opacity="0.7">
      <rect x="-95" y="-60" width="10" height="8" fill="#3b82f6"/>
      <rect x="-95" y="-40" width="10" height="8" fill="#06b6d4"/>
      <rect x="-95" y="-20" width="10" height="8" fill="#10b981"/>
      <rect x="-95" y="0" width="10" height="8" fill="#3b82f6"/>
      <rect x="-95" y="20" width="10" height="8" fill="#06b6d4"/>
      <rect x="-95" y="40" width="10" height="8" fill="#10b981"/>
      
      <rect x="85" y="-60" width="10" height="8" fill="#3b82f6"/>
      <rect x="85" y="-40" width="10" height="8" fill="#06b6d4"/>
      <rect x="85" y="-20" width="10" height="8" fill="#10b981"/>
      <rect x="85" y="0" width="10" height="8" fill="#3b82f6"/>
      <rect x="85" y="20" width="10" height="8" fill="#06b6d4"/>
      <rect x="85" y="40" width="10" height="8" fill="#10b981"/>
    </g>
    
    <!-- CPU core grid -->
    <g>
      <rect x="-50" y="-50" width="40" height="40" rx="3" fill="#3b82f6" opacity="0.3"/>
      <rect x="10" y="-50" width="40" height="40" rx="3" fill="#06b6d4" opacity="0.3"/>
      <rect x="-50" y="10" width="40" height="40" rx="3" fill="#10b981" opacity="0.3"/>
      <rect x="10" y="10" width="40" height="40" rx="3" fill="#3b82f6" opacity="0.3"/>
    </g>
    
    <!-- Center processing indicator -->
    <circle cx="0" cy="0" r="25" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="0" cy="0" r="15" fill="url(#accent)" opacity="0.3"/>
    <text x="0" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle">CPU</text>
    
    <!-- ML prediction arrows -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="30" fill="url(#accent)" opacity="0.2"/>
      <text x="0" y="5" font-family="Arial" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">ML</text>
      <line x1="-80" y1="0" x2="-30" y2="0" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#06b6d4" />
      </marker>
    </defs>
  </g>
  
  <!-- Data analytics dashboard -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#000000" opacity="0.6"/>
    <text x="100" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">3,800+ CPUs</text>
    <text x="100" y="50" font-family="Arial" font-size="12" fill="#06b6d4" text-anchor="middle">Ensemble Models</text>
    <text x="100" y="70" font-family="Arial" font-size="12" fill="#10b981" text-anchor="middle">Price Prediction</text>
    <text x="100" y="90" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">Performance Analysis</text>
  </g>
  
  <!-- Performance chart visualization -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#000000" opacity="0.6"/>
    <!-- Mini bar chart -->
    <rect x="20" y="60" width="15" height="30" fill="#3b82f6" opacity="0.7"/>
    <rect x="45" y="40" width="15" height="50" fill="#06b6d4" opacity="0.7"/>
    <rect x="70" y="50" width="15" height="40" fill="#10b981" opacity="0.7"/>
    <rect x="95" y="30" width="15" height="60" fill="#3b82f6" opacity="0.7"/>
    <rect x="120" y="45" width="15" height="45" fill="#06b6d4" opacity="0.7"/>
    <rect x="145" y="35" width="15" height="55" fill="#10b981" opacity="0.7"/>
    <text x="100" y="20" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">Performance Analytics</text>
  </g>
  
  <!-- Tech stack badges -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="700" height="35" rx="8" fill="#000000" opacity="0.5"/>
    <text x="350" y="23" font-family="Arial" font-size="12" fill="url(#accent)" text-anchor="middle">
      React + TypeScript • FastAPI • scikit-learn • Random Forest • Gradient Boosting • 3.8K Dataset
    </text>
  </g>
  
  <!-- Title overlay -->
  <g transform="translate(50, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#accent)">
      CPU INSIGHT ENGINE
    </text>
  </g>
</svg>
